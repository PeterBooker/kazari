name: Scheduled

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"
  GOVULNCHECK_VERSION: "v1.10.0" # as in ci.yml

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go run "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION" ./...

  stress:
    name: Race tests, five shuffled runs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CGO_ENABLED: "1" # the race detector needs cgo
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -count=5 -shuffle=on -timeout=20m ./...

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -count=1 -coverpkg=./... -coverprofile=cover.out ./...
      - name: Summary
        run: |
          {
            echo '```text'
            go tool cover -func=cover.out | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  install-script:
    uses: $/.github/workflows/install-script.yml
