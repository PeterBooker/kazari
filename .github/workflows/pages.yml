name: Pages

# Pages must use "GitHub Actions" as its source, with the custom domain kazari.io. The base URL comes
# from site/hugo.toml, not the Pages settings, which report http:// until GitHub can enforce HTTPS.

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["site/**", "docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: "0.168.0"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Hugo
        run: |
          base=https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}
          archive=hugo_${HUGO_VERSION}_linux-amd64.tar.gz
          curl -fsSLO "$base/$archive"
          curl -fsSL "$base/hugo_${HUGO_VERSION}_checksums.txt" | grep " $archive\$" | sha256sum --check
          tar -xzf "$archive" hugo
          sudo install -m 0755 hugo /usr/local/bin/hugo
          hugo version
      - name: Build
        run: hugo --source site --gc --minify
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
