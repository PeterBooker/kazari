name: Package

on:
  pull_request:
    paths:
      - ".dockerignore"
      - "deploy/**"
      - "go.mod"
      - "go.sum"
      - ".goreleaser.yaml"
      - ".github/scripts/smoke-image.sh"
      - ".github/workflows/package.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  GORELEASER_VERSION: "v2.20.3" # as in ci.yml

jobs:
  image:
    name: Build and start the development image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check that both Dockerfiles build the same runtime image
        # Only the lines that bring the binary and the data directory in may differ.
        run: |
          runtime() { sed -n '/^FROM gcr.io\/distroless/,$p' "$1" | grep -v -e '^#' -e '^ARG ' -e '^COPY '; }
          diff <(runtime deploy/Dockerfile) <(runtime deploy/Dockerfile.goreleaser)
      - run: docker build --file deploy/Dockerfile --tag kazari:dev .
      - run: .github/scripts/smoke-image.sh kazari:dev

  snapshot:
    name: Snapshot release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # goreleaser reads the version from the tags
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go run "github.com/goreleaser/goreleaser/v2@$GORELEASER_VERSION" release --snapshot --clean --skip=publish,sign,sbom
      - name: Start the image that would be released
        run: .github/scripts/smoke-image.sh "$(jq -r '[.[] | select(.type == "Docker Image" and .extra.Platforms == ["linux/amd64"])][0].name' dist/artifacts.json)"
