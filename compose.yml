# Kazari for local development and testing: the image built from
# deploy/Dockerfile, run with serve --local (plain HTTP, base domain
# localhost, data in a named volume). deploy/compose.yml is the one for a
# real server.
#
#   docker compose up --build -d      # start; pages at http://<slug>.localhost:8080/
#   docker compose logs -f            # follow the server log
#   docker compose watch              # rebuild and restart when the source changes
#   docker compose down               # stop; add -v to discard the data too
#
# The admin commands run inside the container over the admin socket, so they
# need no token; then publish from the host with the key:
#   docker compose exec kazari kazari admin users create peter --role admin
#   docker compose exec kazari kazari admin keys issue peter --label laptop
#   KAZARI_URL=http://api.localhost:8080 KAZARI_TOKEN=kzk_... go run ./cmd/kazari publish ./site --slug demo
#
# A ./.env (start from deploy/kazari.env.example) is passed into the container
# for KAZARI_* overrides.

services:
  kazari:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: kazari:dev
    command: ["serve", "--local"]
    ports:
      # Loopback only: *.localhost resolves to both 127.0.0.1 and ::1.
      - "127.0.0.1:8080:8080"
      - "[::1]:8080:8080"
    volumes:
      - data:/var/lib/kazari
    env_file:
      - path: .env
        required: false
    environment:
      # --local binds loopback; inside the container the published port
      # must listen on every interface (the ports above stay on loopback).
      KAZARI_LISTEN_HTTP: ":8080"
    healthcheck:
      # Over the admin socket in the data volume, which needs no token.
      test: ["CMD", "/usr/local/bin/kazari", "admin", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
      start_interval: 1s
    develop:
      watch:
        - action: rebuild
          path: .
          ignore:
            - .data/
            - .git/
            - docs/
            - site/
            - "*.md"

volumes:
  data:
