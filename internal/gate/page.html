<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>{{.Title}}</title>
{{template "theme/inline"}}
</head>
{{template "theme/door-open"}}<h1 class="title">{{.Title}}</h1>
<p>{{.Message}}</p>
{{with .Unlock}}<form method="post" action="{{.Action}}">
<input type="hidden" name="token" value="{{.Token}}">
<div class="field"><label for="password">Password</label>
<input class="input" type="password" id="password" name="password" autocomplete="off" required autofocus{{if .Error}} aria-invalid="true" aria-describedby="password_error"{{end}}>
{{if .Error}}<p class="error" id="password_error">{{.Error}}</p>
{{end}}</div>
<button type="submit" class="btn btn-primary">Open the page</button>
</form>
{{end}}{{if .Form}}<form method="post" action="{{.Form}}"><button type="submit" class="btn btn-primary">Sign out of this page</button></form>
{{end}}{{if .Link}}<p><a href="{{.Link}}">{{.LinkText}}</a></p>
{{end}}{{template "theme/door-close" ""}}
