# An OpenTelemetry Collector in front of a tracing and metrics backend, for
# Kazari's telemetry. It needs the contrib distribution (otelcol-contrib) for
# tail sampling. Point Kazari at it:
#
#   telemetry:
#     otlp:
#       endpoint: http://otel-collector:4318
#     metrics:
#       otlp: true
#     logs:
#       otlp: true
#
# Tail sampling keeps every trace with an error or a slow span and a share of
# the rest. To have it see every page view, not one in a hundred, set
# telemetry.traces.site_sample_ratio: 1 in Kazari and let the collector
# decide; the metrics count every request either way.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  tail_sampling:
    decision_wait: 10s
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: slow
        type: latency
        latency:
          threshold_ms: 2000
      - name: some-of-the-rest
        type: probabilistic
        probabilistic:
          sampling_percentage: 10
  # Spans carry slugs and file paths. Before sending them to a hosted
  # vendor, drop what should not leave the network (add it to the traces
  # pipeline below).
  attributes/drop-paths:
    actions:
      - key: kazari.artifact.slug
        action: delete
      - key: url.path
        action: delete
      - key: server.address
        action: delete
  batch: {}

exporters:
  debug:
    verbosity: basic
  # The backend, for example Grafana Cloud, Honeycomb or another collector:
  # otlphttp:
  #   endpoint: https://otlp.example.com
  #   headers:
  #     authorization: Bearer ${env:OTLP_TOKEN}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
