# Kazari configuration: the settings every instance needs. Every other key
# has a default; kazari.reference.yaml lists them all with their defaults,
# and https://kazari.io/docs/configuration/ explains them.
#
# Secrets stay out of this file. ${NAME} is replaced by the environment
# variable NAME, read from the process environment or from the dotenv file
# (/etc/kazari/kazari.env under systemd, .env beside compose.yml). Any key
# can also be set as KAZARI_<SECTION>_<KEY>, such as KAZARI_BASE_DOMAIN.

base_domain: art.example.com          # pages are served at <slug>.art.example.com
data_dir: /var/lib/kazari

tls:
  email: ops@example.com              # Let's Encrypt account contact
  # cloudflare, route53, hetzner, digitalocean, gandi, ovh, namecheap or
  # duckdns; its credential goes in the dotenv file. Other providers:
  # https://kazari.io/docs/certificates/
  dns_provider: cloudflare
  dns:
    api_token: ${KAZARI_TLS_DNS_API_TOKEN}

# On this host, kazari admin commands use the socket in data_dir and need
# no token. To administer from elsewhere, set KAZARI_AUTH_ADMIN_TOKEN in the
# dotenv file (at least 32 characters: openssl rand -hex 32).
