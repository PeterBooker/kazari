# Kazari configuration reference: every key with its default, except
# base_domain, data_dir and tls.email, which have none. kazari.yaml is the
# short file an instance starts from.
#
# Secrets are never written here: a value of the form ${NAME} (or
# ${NAME:-default}) is replaced by the environment variable NAME, read from
# the process environment or from a dotenv file (/etc/kazari/kazari.env
# under systemd, .env beside compose.yml or in the working directory, or
# the file named by --env-file / $KAZARI_ENV_FILE). A reference to an unset
# variable without a default is an error.
#
# Any key can also be overridden directly by an environment variable named
# KAZARI_ plus the key's path upper-cased with dots as underscores, e.g.
# listen.proxy_mode -> KAZARI_LISTEN_PROXY_MODE. Lists are comma-separated.
# A secret also reads KAZARI_<KEY>_FILE, the path of a file holding it.
# Sizes take B, KiB, MiB, GiB, TiB, KB, MB, GB or TB; durations are Go
# durations ("15m", "336h") and may start with whole days ("14d").

base_domain: art.example.com         # artifacts are served at <slug>.art.example.com
data_dir: /var/lib/kazari            # kazari.db, blobs/, uploads/, certmagic/, admin.sock

# Public URL shape. kazari serve --local uses external_scheme: http and
# external_port: 8080 (http://demo.localhost:8080/).
external_scheme: https               # https | http
external_port: 0                     # 0 omits the port from URLs

listen:
  https: ":443"
  http: ":80"                        # redirects to https; "" disables
  proxy_mode: false                  # true: plain HTTP on listen.http, trust X-Forwarded-*

tls:
  mode: acme                         # acme | files | self-signed
  email: ops@example.com             # ACME account contact
  ca: letsencrypt                    # letsencrypt | letsencrypt-staging | <https directory URL>
  # cloudflare | route53 | hetzner | digitalocean | gandi | ovh | namecheap | duckdns
  dns_provider: cloudflare
  cert_file: ""                      # mode: files
  key_file: ""
  dns:
    # The provider's credential. route53 uses the AWS credential chain when
    # empty, or ACCESS_KEY_ID:SECRET_ACCESS_KEY; ovh takes
    # APPLICATION_KEY:APPLICATION_SECRET:CONSUMER_KEY.
    api_token: ${KAZARI_TLS_DNS_API_TOKEN}
    endpoint: ""                     # ovh: ovh-eu (default), ovh-ca or ovh-us
    user: ""                         # namecheap: the API user
    client_ip: ""                    # namecheap: the allow-listed IP; discovered when empty

limits:
  max_version_bytes: 50MiB
  max_file_bytes: 25MiB
  max_files: 2000
  metadata_max_pairs: 64
  write_rate_per_minute: 60
  default_user_quota: 2GiB
  inline_guidance_bytes: 2MiB        # quoted in tool descriptions as the point to switch to chunks
  max_chunk_bytes: 4MiB              # per upload_chunk call, after base64 decoding
  upload_ttl: 1h
  max_open_uploads: 5                # per user

lifecycle:
  default_grace: 336h                # 14 days
  retention: 720h                    # 30 days
  tombstone: 2160h                   # 90 days
  sweep_interval: 15m
  gc_interval: 1h

serve:
  csp: "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'"
  # frame-ancestors 'none' also keeps the MCP preview app to links; list an MCP host's
  # app origins there to let it embed pages (docs/mcp.md, Preview app).
  allow_csp_override: true           # kazari.csp metadata replaces csp for that artifact
  reserved_slugs: [api, mcp, admin, www, mail, ns1, ns2, autoconfig, autodiscover, localhost]
  # Visibility of artifacts created without one: public | unlisted | members.
  # members pages open only for people who sign in to this instance (or hold
  # a share link); members is the safer default for an internal instance.
  default_visibility: public
  share_link_max_ttl: 90d            # longest a share link may stay valid

# URLs the server fetches for members: a file named by url in a create or
# update, and the page an import_page call copies. Public addresses only.
fetch:
  enabled: true                      # false removes import_page and refuses files[].url
  timeout: 15s                       # one request
  budget: 1m                         # every request of one import together

auth:
  write_policy: shared               # shared | owner
  admin_token: ${KAZARI_AUTH_ADMIN_TOKEN}
  # Sign-in through the organisation's OpenID Connect provider. Leave oidc
  # out entirely to fall back to API-key sign-in on the consent page.
  # Register https://mcp.<base_domain>/oauth/callback as the redirect URI; it
  # serves MCP clients and people opening members pages alike.
  #
  # oidc:
  #   issuer: https://login.microsoftonline.com/<tenant-id>/v2.0   # or https://accounts.google.com
  #   client_id: ""
  #   client_secret: ${KAZARI_AUTH_OIDC_CLIENT_SECRET}
  #   allowed_domains: [example.com]  # verified email domains that may sign in
  #   auto_provision: true            # create a member on first sign-in from an allowed domain
  #   admin_emails: []                # provisioned with the admin role; existing admins link by email only when listed

admin:
  listen: ""                         # e.g. "127.0.0.1:9443": serve the admin host here only, not publicly
  # Unix socket that serves the admin API to this host without a token;
  # relative to data_dir unless absolute, "" disables it.
  socket: admin.sock

log:
  level: info                        # debug | info | warn | error
  format: text                       # text | json
