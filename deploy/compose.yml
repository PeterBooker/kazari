# Kazari from the published image, for a server with ports 80 and 443. In
# an empty directory, fetch this file with the two configuration files,
# edit those, then start (https://kazari.io/docs/install/):
#
#   curl -fsSLO https://kazari.io/deploy/compose.yml
#   curl -fsSLO https://kazari.io/deploy/kazari.yaml            # the domain and the DNS provider
#   curl -fsSL  https://kazari.io/deploy/kazari.env.example -o .env   # the DNS provider's token
#   docker compose up -d
#   docker compose logs kazari        # prints the setup link for the first admin
#
# The image serves /etc/kazari/kazari.yaml; the data (SQLite, blobs,
# certificates, the admin socket) lives in the volume kazari_data. Admin
# commands run inside the container, over the socket, with no token:
#
#   docker compose exec kazari kazari admin setup-link
#
# Backups: kazari admin backup - streams one as tar, which needs no mount:
#   docker compose exec -T kazari kazari admin backup - > kazari-$(date +%F).tar
# or uncomment the ./backups mount below and write into it:
#   docker compose exec kazari kazari admin backup /backup/$(date +%F)

services:
  kazari:
    image: ghcr.io/peterbooker/kazari:${KAZARI_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./kazari.yaml:/etc/kazari/kazari.yaml:ro
      - data:/var/lib/kazari
      # The server runs as UID 65532: create the directory first with
      # mkdir backups && sudo chown 65532:65532 backups
      # - ./backups:/backup
    env_file:
      - .env
    # To export traces to an OpenTelemetry collector or vendor, set its
    # endpoint here or in .env; a vendor's token goes in .env as
    # KAZARI_TELEMETRY_OTLP_HEADERS.
    # environment:
    #   KAZARI_TELEMETRY_OTLP_ENDPOINT: http://otel-collector:4318
    # Images after 0.8.0 carry this check themselves; it stays for 0.8.0 and earlier.
    healthcheck:
      # Over the admin socket in the data volume, which needs no token.
      test: ["CMD", "/usr/local/bin/kazari", "admin", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  data:
