# Local development at http://<slug>.localhost:8080/ (browsers resolve *.localhost to loopback).
# compose.yml mounts this file too; the image's KAZARI_DATA_DIR replaces ./.data.

base_domain: localhost
data_dir: ./.data
external_scheme: http
external_port: 8080

listen:
  # Loopback only, as the admin token below is public. compose.yml publishes
  # the container's port on loopback instead.
  http: "127.0.0.1:8080"
  proxy_mode: true

tls:
  mode: self-signed

auth:
  admin_token: ${KAZARI_AUTH_ADMIN_TOKEN:-dev-admin-token}

log:
  level: debug
