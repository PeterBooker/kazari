version: 2

project_name: kazari

builds:
  - id: kazari
    main: ./cmd/kazari
    binary: kazari
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/PeterBooker/kazari/internal/buildinfo.version={{.Version}}
      - -X github.com/PeterBooker/kazari/internal/buildinfo.commit={{.Commit}}
      - -X github.com/PeterBooker/kazari/internal/buildinfo.date={{.CommitDate}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: amd64

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # The commit's time and a fixed owner on every entry, so that the same
    # commit gives the same archive.
    builds_info: &reproducible
      owner: root
      group: root
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info: *reproducible
      - src: README.md
        info: *reproducible
      - src: CHANGELOG.md
        info: *reproducible
      - src: deploy/kazari.yaml
        info: *reproducible
      - src: deploy/kazari.reference.yaml
        info: *reproducible
      - src: deploy/kazari.env.example
        info: *reproducible
      - src: deploy/kazari.service
        info: *reproducible
      - src: deploy/compose.yml
        info: *reproducible
      - src: deploy/Caddyfile
        info: *reproducible

# deb and rpm packages: the binary, the unit, the two configuration files
# (kept on upgrade) and the reference files under /usr/share/doc/kazari.
nfpms:
  - id: packages
    package_name: kazari
    vendor: Peter Booker
    homepage: https://kazari.io/
    maintainer: Peter Booker <mail@peterbooker.com>
    description: |-
      Self-hosted artifact host. One binary serves every page at
      <slug>.<your-domain> under a wildcard certificate, with a REST API, an
      MCP server for AI agents and a CLI.
    license: MIT
    formats: [deb, rpm]
    bindir: /usr/bin
    mtime: "{{ .CommitDate }}"
    contents:
      - src: deploy/kazari.service
        dst: /usr/lib/systemd/system/kazari.service
      - src: deploy/kazari.yaml
        dst: /etc/kazari/kazari.yaml
        type: config|noreplace
      - src: deploy/kazari.env.example
        dst: /etc/kazari/kazari.env
        type: config|noreplace
        file_info:
          mode: 0600
      - src: deploy/kazari.reference.yaml
        dst: /usr/share/doc/kazari/kazari.reference.yaml
      - src: deploy/compose.yml
        dst: /usr/share/doc/kazari/compose.yml
      - src: deploy/Caddyfile
        dst: /usr/share/doc/kazari/Caddyfile
      - src: LICENSE
        dst: /usr/share/doc/kazari/LICENSE
      - src: CHANGELOG.md
        dst: /usr/share/doc/kazari/CHANGELOG.md
    scripts:
      postinstall: deploy/packaging/postinstall.sh
      preremove: deploy/packaging/preremove.sh

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes
    artifacts: checksum

# One multi-platform image, built from the binaries above and pushed with an
# SBOM attached. A snapshot loads one image per platform instead, tagged
# <version>-amd64 and <version>-arm64.
dockers_v2:
  - id: image
    ids: [kazari]
    dockerfile: deploy/Dockerfile.goreleaser
    images:
      - ghcr.io/peterbooker/kazari
    tags:
      - "{{ .Version }}"
      - "{{ if not .IsSnapshot }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.source: https://github.com/PeterBooker/kazari
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: MIT

docker_signs:
  - cmd: cosign
    args: [sign, --yes, "${artifact}@${digest}"]

# The release notes are the version's section of CHANGELOG.md, which
# release.yml passes with --release-notes.
changelog:
  disable: true

release:
  github:
    owner: PeterBooker
    name: kazari
  draft: false
  prerelease: auto
