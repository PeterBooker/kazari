<dialog class="search-dialog" aria-label="Search the documentation">
  <form method="dialog" class="search-form" role="search">
    {{ partial "icon.html" "search" }}
    <input type="search" name="q" role="combobox" placeholder="Search the documentation" autocomplete="off" spellcheck="false" aria-label="Search" aria-controls="search-results" aria-autocomplete="list" aria-expanded="false">
    <button type="button" class="search-close" data-search-close><kbd>Esc</kbd><span class="sr-only"> to close the search</span></button>
  </form>
  <ul id="search-results" class="search-results" role="listbox" aria-label="Results"></ul>
  <p class="search-empty" hidden>No results. Try a tool name, a config key or an error code.</p>
  <p class="sr-only" role="status" data-search-status></p>
</dialog>
