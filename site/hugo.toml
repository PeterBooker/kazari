baseURL = "https://kazari.io/"
title = "Kazari"
locale = "en-GB"
disableKinds = ["taxonomy", "term", "rss"]
enableRobotsTXT = true
# Last-modified dates from git, for sitemap.xml and the docs pages' structured data; pages.yml checks
# out the full history so that they are right.
enableGitInfo = true

# The site's description is the one in content/_index.md.
[params]
  repo = "https://github.com/PeterBooker/kazari"
  branch = "main"
  # The author named in the structured data (_partials/schema.html).
  [params.author]
    name = "Peter Booker"
    url = "https://github.com/PeterBooker"

# /llms.txt, from layouts/home.llms.txt.
[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["html", "json", "llms"]
  section = ["html"]
  page = ["html"]

[markup]
  # The docs are ours, so their raw HTML (the overview cards) is trusted.
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.parser]
    autoHeadingIDType = "github"
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "../docs"
    target = "content/docs"
    files = ["! security.md", "! adr/**"]
  [[module.mounts]]
    source = "static"
    target = "static"
  # The deployment files, so that https://kazari.io/deploy/compose.yml is the
  # file in the repository.
  [[module.mounts]]
    source = "../deploy"
    target = "static/deploy"
    files = ["compose.yml", "kazari.yaml", "kazari.reference.yaml", "kazari.env.example", "kazari.service", "Caddyfile"]
