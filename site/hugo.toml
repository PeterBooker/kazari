# The Kazari website and documentation at https://kazari.io/, published to GitHub Pages by
# .github/workflows/pages.yml. Build: hugo --source site. Preview: hugo server --source site.
# The reference pages are the Markdown files in ../docs, mounted under /docs/, except the security
# design and the architecture decision records, which stay on GitHub only.

baseURL = "https://kazari.io/"
title = "Kazari"
locale = "en-GB"
disableKinds = ["taxonomy", "term", "rss"]
enableRobotsTXT = true
# Last-modified dates from git, for sitemap.xml and the docs pages' structured data; pages.yml checks
# out the full history so that they are right.
enableGitInfo = true

# The site's description is the one in content/_index.md.
[params]
  repo = "https://github.com/PeterBooker/kazari"
  branch = "main"
  # The author named in the structured data (_partials/schema.html).
  [params.author]
    name = "Peter Booker"
    url = "https://github.com/PeterBooker"

# /llms.txt, from layouts/home.llms.txt.
[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["html", "json", "llms"]
  section = ["html"]
  page = ["html"]

[markup]
  # The docs pages are ours, so raw HTML in them (the cards on the overview page) is allowed.
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.parser]
    autoHeadingIDType = "github"
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "../docs"
    target = "content/docs"
    files = ["! security.md", "! adr/**"]
