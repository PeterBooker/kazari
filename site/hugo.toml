baseURL = "https://kazari.io/"
title = "Kazari"
locale = "en-GB"
disableKinds = ["taxonomy", "term", "rss"]
enableRobotsTXT = true

[params]
  description = "A self-hosted home for the pages AI agents build: prototypes, reports and dashboards on your own domain, with versions, sign-in through your identity provider and an MCP server, REST API and CLI."
  repo = "https://github.com/PeterBooker/kazari"
  branch = "main"

[outputs]
  home = ["html", "json"]
  section = ["html"]
  page = ["html"]

[markup]
  # The docs are ours, so their raw HTML (the overview cards) is trusted.
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.parser]
    autoHeadingIDType = "github"
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "../docs"
    target = "content/docs"
    files = ["! security.md", "! adr/**"]
