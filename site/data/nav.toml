[[sections]]
  title = "Run Kazari"
  ja = "運用"
  [[sections.pages]]
    title = "Install"
    path = "/docs/install"
    description = "Install Kazari on your own server: DNS and a wildcard certificate, the release binary under systemd or Docker, proxy mode, and the first admin user and key."
  [[sections.pages]]
    title = "Configuration"
    path = "/docs/configuration"
    description = "Every Kazari configuration key: the YAML file, ${} environment references, .env files and KAZARI_ overrides, with defaults, validation rules and secrets."
  [[sections.pages]]
    title = "Sign-in and identity"
    path = "/docs/identity"
    description = "How people and agents sign in to Kazari: API keys, OAuth 2.1 for MCP clients, OpenID Connect providers such as Entra ID and Google, and provisioning."
  [[sections.pages]]
    title = "Operations"
    path = "/docs/ops"
    description = "Running Kazari: data layout, backups, upgrades, logs, Prometheus metrics, scheduled jobs, the page lifecycle, quotas, abuse response and the audit log."

[[sections]]
  title = "Reference"
  ja = "参照"
  [[sections.pages]]
    title = "MCP server"
    path = "/docs/mcp"
    description = "Reference for Kazari's MCP server: connecting an agent over Streamable HTTP, its tools, editing files, the skill, the preview app, chunked uploads and errors."
  [[sections.pages]]
    title = "CLI"
    path = "/docs/cli"
    description = "Reference for the kazari command line: publish, update, edit and roll back artifacts, admin commands, configuration, JSON output and exit codes."
